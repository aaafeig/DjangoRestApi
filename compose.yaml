services:
  server:
    build:
      context: .
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
       db:
         condition: service_healthy
  db:
     image: postgres:16
     restart: always
     user: postgres
     volumes:
       - db-data:/var/lib/postgresql/data
     environment:
       POSTGRES_DB: ${NAME}
       POSTGRES_PASSWORD: ${PASSWORD}
     expose:
       - 5432
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U postgres"]
       interval: 10s
       timeout: 5s
       retries: 5
volumes:
   db-data:


